name: Wisq
description: 'Wisq is an AI platform for human resources that automates HR service management,
  HR operations, and employee relations. Its conversational AI HR agent, Harper, answers
  employee requests across chat, email, Slack, Teams, SMS, and mobile, while its proprietary
  HR Language Model (HRLM) provides HR-specific reasoning, aiming to resolve the majority
  of routine HR cases without a human in the loop. Founded by Jim Barnett and Chih-Po
  Wen (formerly of Glint), Wisq is backed by Norwest Venture Partners, Shasta Ventures,
  and True Ventures. Wisq operates a private, login-gated product and publishes no public
  developer API at this time.'
